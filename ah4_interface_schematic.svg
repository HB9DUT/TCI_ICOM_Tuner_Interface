<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1120" width="760" height="1120" font-family="Helvetica, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="760" height="1120" fill="#ffffff"/>
  <defs>
    <style>
      .w  { stroke:#222; stroke-width:2; fill:none; }
      .p  { stroke:#c0392b; stroke-width:2; fill:none; }
      .v3 { stroke:#e67e22; stroke-width:2; fill:none; }
      .g  { stroke:#333; stroke-width:2.5; fill:none; }
      .r  { fill:#fff; stroke:#222; stroke-width:2; }
      .t  { fill:#222; }
      .tp { fill:#c0392b; font-weight:bold; }
      .t3 { fill:#e67e22; font-weight:bold; }
      .h  { fill:#111; font-size:17px; font-weight:bold; }
      .s  { fill:#555; font-size:12px; }
      .n  { fill:#222; stroke:none; }
      .term { fill:#fff; stroke:#222; stroke-width:2; }
      .box { fill:#f4f6f8; stroke:#222; stroke-width:2; }
      .sep { stroke:#bbb; stroke-width:1; stroke-dasharray:6 5; }
    </style>
  </defs>

  <text x="30" y="30" class="h">AH-4 interface: schematic</text>

  <!-- ================= SUPPLY ================= -->
  <text x="30" y="58" class="h" font-size="15">1. Supply</text>
  <text x="60" y="82" class="tp" text-anchor="middle">+13.8 V</text>
  <circle cx="60" cy="95" r="5" class="term"/>
  <line x1="65" y1="95" x2="130" y2="95" class="p"/>
  <rect x="130" y="88" width="60" height="14" class="r"/>
  <text x="160" y="80" class="t" text-anchor="middle">F1 fuse 1 A</text>
  <line x1="190" y1="95" x2="620" y2="95" class="p"/>
  <circle cx="300" cy="95" r="3.5" class="n"/>
  <circle cx="620" cy="95" r="5" class="term"/>
  <text x="632" y="99" class="t">+13.8 V to tuner</text>

  <line x1="300" y1="95" x2="300" y2="130" class="p"/>
  <rect x="255" y="130" width="90" height="48" rx="4" class="box"/>
  <text x="300" y="150" text-anchor="middle" class="t" font-weight="bold">Buck</text>
  <text x="300" y="168" text-anchor="middle" class="t">13.8 V to 5 V</text>
  <line x1="345" y1="154" x2="450" y2="154" class="p"/>
  <rect x="450" y="130" width="170" height="48" rx="4" class="box"/>
  <text x="535" y="150" text-anchor="middle" class="t" font-weight="bold">ESP32 DevKit</text>
  <text x="535" y="168" text-anchor="middle" class="t">5V / VIN</text>

  <line x1="60" y1="215" x2="620" y2="215" class="g"/>
  <circle cx="60" cy="215" r="5" class="term"/>
  <text x="60" y="238" class="t" text-anchor="middle">GND</text>
  <line x1="300" y1="178" x2="300" y2="215" class="g"/>
  <line x1="535" y1="178" x2="535" y2="215" class="g"/>
  <circle cx="300" cy="215" r="3.5" class="n"/>
  <circle cx="535" cy="215" r="3.5" class="n"/>
  <circle cx="620" cy="215" r="5" class="term"/>
  <text x="632" y="219" class="t">GND tuner and ESP32 (common)</text>

  <line x1="20" y1="255" x2="740" y2="255" class="sep"/>

  <!-- ================= START ================= -->
  <text x="30" y="282" class="h" font-size="15">2. START: ESP32 GPIO27 to tuner (GPIO27 HIGH = START active)</text>

  <text x="322" y="310" class="tp" text-anchor="middle">+13.8 V</text>
  <line x1="322" y1="318" x2="322" y2="335" class="p"/>
  <rect x="315" y="335" width="14" height="40" class="r"/>
  <text x="340" y="352" class="t">R2 4k7</text>
  <text x="340" y="367" class="s">pull-up (replaces the radio's)</text>
  <line x1="322" y1="375" x2="322" y2="410" class="w"/>
  <circle cx="322" cy="410" r="3.5" class="n"/>

  <!-- Q1 -->
  <line x1="322" y1="410" x2="322" y2="456" class="w"/>
  <line x1="322" y1="456" x2="300" y2="472" class="w"/>
  <line x1="300" y1="462" x2="300" y2="498" class="w" stroke-width="3"/>
  <line x1="300" y1="488" x2="322" y2="504" class="w"/>
  <polygon points="322,504 309.5,499.8 314.3,493.4" fill="#222"/>
  <line x1="322" y1="504" x2="322" y2="580" class="g"/>
  <text x="345" y="484" class="t" font-weight="bold">Q1</text>
  <text x="345" y="500" class="s">BC547 (NPN)</text>

  <!-- base network -->
  <circle cx="60" cy="480" r="5" class="term"/>
  <text x="60" y="466" class="t" text-anchor="middle" font-weight="bold">GPIO27</text>
  <line x1="65" y1="480" x2="110" y2="480" class="w"/>
  <rect x="110" y="473" width="60" height="14" class="r"/>
  <text x="140" y="465" class="t" text-anchor="middle">R1 4k7</text>
  <line x1="170" y1="480" x2="300" y2="480" class="w"/>
  <circle cx="250" cy="480" r="3.5" class="n"/>
  <line x1="250" y1="480" x2="250" y2="515" class="w"/>
  <rect x="243" y="515" width="14" height="40" class="r"/>
  <text x="265" y="540" class="t">R3 100k</text>
  <line x1="250" y1="555" x2="250" y2="580" class="g"/>
  <circle cx="250" cy="580" r="3.5" class="n"/>

  <!-- output -->
  <line x1="322" y1="410" x2="620" y2="410" class="w"/>
  <circle cx="470" cy="410" r="3.5" class="n"/>
  <line x1="470" y1="410" x2="470" y2="470" class="w"/>
  <line x1="456" y1="470" x2="484" y2="470" class="w" stroke-width="3"/>
  <line x1="456" y1="478" x2="484" y2="478" class="w" stroke-width="3"/>
  <line x1="470" y1="478" x2="470" y2="580" class="g"/>
  <circle cx="470" cy="580" r="3.5" class="n"/>
  <text x="492" y="478" class="t">C1 10 nF</text>
  <circle cx="620" cy="410" r="5" class="term"/>
  <text x="632" y="414" class="t" font-weight="bold">START</text>
  <text x="632" y="430" class="s">to tuner</text>

  <line x1="60" y1="580" x2="620" y2="580" class="g"/>
  <circle cx="322" cy="580" r="3.5" class="n"/>
  <circle cx="620" cy="580" r="5" class="term"/>
  <text x="632" y="584" class="t">GND</text>

  <line x1="20" y1="620" x2="740" y2="620" class="sep"/>

  <!-- ================= KEY ================= -->
  <text x="30" y="647" class="h" font-size="15">3. KEY: tuner to ESP32 GPIO26 (GPIO26 HIGH = KEY active)</text>

  <text x="140" y="690" class="tp" text-anchor="middle">+13.8 V</text>
  <text x="422" y="690" class="t3" text-anchor="middle">+3.3 V</text>

  <!-- R4 -->
  <line x1="140" y1="698" x2="140" y2="715" class="p"/>
  <rect x="133" y="715" width="14" height="40" class="r"/>
  <text x="156" y="732" class="t">R4 10k</text>
  <text x="156" y="747" class="s">pull-up</text>
  <line x1="140" y1="755" x2="140" y2="830" class="w"/>

  <!-- R7 -->
  <line x1="422" y1="698" x2="422" y2="710" class="v3"/>
  <rect x="415" y="710" width="14" height="40" class="r"/>
  <text x="438" y="727" class="t">R7 10k</text>
  <text x="438" y="742" class="s" fill="#e67e22">to 3.3 V only!</text>
  <line x1="422" y1="750" x2="422" y2="775" class="w"/>
  <circle cx="422" cy="775" r="3.5" class="n"/>

  <!-- KEY line -->
  <circle cx="60" cy="830" r="5" class="term"/>
  <text x="60" y="816" class="t" text-anchor="middle" font-weight="bold">KEY</text>
  <text x="60" y="852" class="s" text-anchor="middle">from tuner</text>
  <line x1="65" y1="830" x2="250" y2="830" class="w"/>
  <circle cx="140" cy="830" r="3.5" class="n"/>
  <circle cx="200" cy="830" r="3.5" class="n"/>
  <rect x="250" y="823" width="60" height="14" class="r"/>
  <text x="280" y="815" class="t" text-anchor="middle">R5 47k</text>
  <line x1="310" y1="830" x2="400" y2="830" class="w"/>
  <circle cx="360" cy="830" r="3.5" class="n"/>

  <!-- C2 -->
  <line x1="200" y1="830" x2="200" y2="890" class="w"/>
  <line x1="186" y1="890" x2="214" y2="890" class="w" stroke-width="3"/>
  <line x1="186" y1="898" x2="214" y2="898" class="w" stroke-width="3"/>
  <line x1="200" y1="898" x2="200" y2="960" class="g"/>
  <text x="170" y="880" class="t" text-anchor="end">C2 10 nF</text>
  <circle cx="200" cy="960" r="3.5" class="n"/>

  <!-- R6 -->
  <line x1="360" y1="830" x2="360" y2="870" class="w"/>
  <rect x="353" y="870" width="14" height="40" class="r"/>
  <text x="340" y="895" class="t" text-anchor="end">R6 10k</text>
  <line x1="360" y1="910" x2="360" y2="960" class="g"/>
  <circle cx="360" cy="960" r="3.5" class="n"/>

  <!-- Q2 -->
  <line x1="422" y1="775" x2="422" y2="806" class="w"/>
  <line x1="422" y1="806" x2="400" y2="822" class="w"/>
  <line x1="400" y1="812" x2="400" y2="848" class="w" stroke-width="3"/>
  <line x1="400" y1="838" x2="422" y2="854" class="w"/>
  <polygon points="422,854 409.5,849.8 414.3,843.4" fill="#222"/>
  <line x1="422" y1="854" x2="422" y2="960" class="g"/>
  <circle cx="422" cy="960" r="3.5" class="n"/>
  <text x="445" y="830" class="t" font-weight="bold">Q2</text>
  <text x="445" y="846" class="s">BC547 (NPN)</text>

  <!-- GPIO26 -->
  <line x1="422" y1="775" x2="620" y2="775" class="w"/>
  <circle cx="620" cy="775" r="5" class="term"/>
  <text x="632" y="779" class="t" font-weight="bold">GPIO26</text>
  <text x="632" y="795" class="s">to ESP32</text>

  <line x1="60" y1="960" x2="620" y2="960" class="g"/>
  <circle cx="620" cy="960" r="5" class="term"/>
  <text x="632" y="964" class="t">GND</text>

  <line x1="20" y1="990" x2="740" y2="990" class="sep"/>

  <!-- ================= NOTES ================= -->
  <text x="30" y="1015" class="h" font-size="15">Notes</text>
  <text x="30" y="1037" class="t">R3 keeps Q1 off while GPIO27 floats during boot (no unintended START).</text>
  <text x="30" y="1055" class="t">R6 reliably turns Q2 off when the tuner pulls KEY to GND (residual voltage of the open collector).</text>
  <text x="30" y="1073" class="t">C1 and C2 sit directly at the connector and keep RF off the control lines.</text>
  <text x="30" y="1091" class="t">The AH-4 additionally pulls KEY to 5 V internally via 22 k and a diode.</text>
  <text x="30" y="1109" class="t">Status LED: GPIO2, HIGH = on (DevKit onboard LED).</text>
</svg>
