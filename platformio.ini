; TCI to ICOM Tuner Interface – ESP32-Brücke zwischen ExpertSDR3 (TCI) und einem
; Tuner mit ICOM-AH-4-Schnittstelle (z.B. ICOM AH-4, Stockcorner).
; Framework: ESP-IDF (Konfiguration in sdkconfig.defaults, Komponenten in src/idf_component.yml)

[env:esp32dev]
platform = espressif32@6.11.0
board = esp32dev
framework = espidf
board_build.partitions = partitions.csv
board_build.embed_files = src/index.html
extra_scripts = pre:version.py
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
